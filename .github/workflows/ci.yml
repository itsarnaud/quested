name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quested
          POSTGRES_PASSWORD: quested
          POSTGRES_DB: quested
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quested"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://quested:quested@localhost:5432/quested
      AUTH_SECRET: ci-dummy-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx prisma migrate deploy

      - run: npx tsc --noEmit

      - run: npm run lint

      - run: npm run test

      - run: npm run build
